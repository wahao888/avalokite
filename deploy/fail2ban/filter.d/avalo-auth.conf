# Avalo — 後台／客戶後台登入失敗。
#
# 為什麼讀 journal 而不是 nginx log：登入成功與失敗都回 303 導轉，
# 在 access log 裡完全一樣，也不算 4xx。應用程式自己印的這行是唯一的判別依據。
# 對應 src/app/api/admin/login/route.ts 與 src/app/api/portal/login/route.ts。
#
# 這層也補了應用層鎖定的破口：那個 per-IP 計數存在行程記憶體裡，
# 每次部署重啟就歸零；fail2ban 的封鎖則不受應用程式重啟影響。
[Definition]
failregex = \[auth fail\] \S+ ip=<HOST>
ignoreregex =
journalmatch = _SYSTEMD_UNIT=avalo.service
