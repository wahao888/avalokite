# Avalo — 一擊即封：對「只有攻擊者才會請求的路徑」的探測。
#
# nginx.conf 裡只有掃描路徑那個 location 會 `return 444`，
# 所以 access log 出現 444 就等於「有人在找 .env / wp-admin / .git 之類的東西」，
# 沒有任何正常瀏覽器或搜尋引擎爬蟲會產生這種請求。
# 誤判率實質為零，因此 jail 設 maxretry=1。
#
# 前提：nginx.conf 的 444 清單只能放絕不會撞到真實路由的樣式。
[Definition]
failregex = ^<HOST> -[^"]*"[A-Z]+ [^"]*" 444 \d+
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
