# Avalo — 常見掃描路徑一律 444（不回應直接關連線）。
# 比 404 省資源，也不餵任何資訊給掃描器。
#
# 444 只由這個檔案產生，所以 fail2ban 的 avalo-honeypath jail 直接把
# 「access.log 出現 444」當成攻擊證據，第一次就封（見 deploy/fail2ban/）。
#
# 為什麼獨立成 snippet 而不是寫在 server 區塊裡：
# 這條規則必須「同時」掛在 :443 主站台與 certbot 產生的 :80 導轉站台上。
# 原本只寫在主站台，:80 的探測會先拿到 301 導轉，access.log 記的是 301 不是 444，
# honeypath 因此抓不到——只講 HTTP/1.1、不跟隨導轉的掃描器完全不會被封鎖。
# 2026-08-26 由每日簡報新增的「漏網檢查」發現（前一天 15 次探測都是這樣溜過去的）。
# 兩邊 include 同一份，樣式就不會再走鐘。
#
# ⚠️ 改這裡的樣式時，deploy/daily-report.sh 的 PROBE_RE 要一起改——
#    那支是拿同一組樣式回頭檢查「有沒有漏網」的，兩邊不一致就會誤報或漏報。
#
# ⚠️ 加新樣式前務必確認不會撞到真實路由：/admin、/portal、/products、/quote、
#    /cases/*、/legal/*、/api/* 都是本站真的有的路徑。
#
# 用 `(^|/)` 而非 `^/`：只綁根目錄的話，`/saas/.env`、`/config/.env` 這類巢狀路徑
# 會穿過去變成應用程式的 404（2026-07-31 簡報實際看到 409 次 .env 探測用了這招）。
# 2026-08-26 依兩週日誌補上第二批：這些原本全都直接打進 Next 變成 404。
# 逐一比對過站上真實路由（含 /_next 雜湊檔名、/.well-known/acme-challenge、
# public/ 靜態檔）確認零誤傷，測試清單見 DEPLOY.md。
#   wp-includes/wp-json/wp-config.php  補完 WordPress 家族（原本只擋 admin/login/content）
#   @fs/                               Vite dev server 的任意檔案讀取（/@fs/etc/passwd）
#   webmail|roundcube|file-manager/    webmail 與檔案管理器的已知入口
#   media/system/js/                   Joomla
#   umi.js                             Ant Design Pro 系後台
#   (config|env).(js|json)、api/(config|env)   前端設定檔外洩探測
# 刻意「不」加 rc、mail 這種通用字：未來客戶站可能真的有 /mail，
# 為了少數幾次探測冒誤擋真人的風險不划算。
location ~* (^|/)(wp-admin|wp-login|wp-content|wp-includes|wp-json|wp-config\.php|xmlrpc\.php|phpmyadmin|\.env|\.git|\.svn|\.aws|\.DS_Store|vendor/|cgi-bin/|autodiscover|eval-stdin\.php|server-status|@fs/|webmail|roundcube|file-manager/|media/system/js/|umi(\.min)?\.js|(config|env)\.(js|json)|api/(config|env)$) {
    return 444;
}
