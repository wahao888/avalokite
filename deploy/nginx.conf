# Avalo — Nginx 反向代理（certbot 會自動補上 443/SSL 區塊）
# 速率限制：一般頁面 10r/s、API 5r/s、表單 6r/min（表單那層是 2026-07-30 灌信事件後加的）
limit_req_zone $binary_remote_addr zone=avalo_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=avalo_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=avalo_form:10m rate=6r/m;
# 單一 IP 併發連線上限（擋 slowloris 與連線池洗版）
limit_conn_zone $binary_remote_addr zone=avalo_conn:10m;

# 預設站台：擋掉 Host 標頭亂送。
# 沒有這一段的話，任何人把自己的網域指到這台機器的 IP，nginx 會用下面的主站台招待他，
# 等於幫別人代管內容（也讓本站成為 SEO 汙染的跳板）。444 = 不回應直接關連線。
# 必須排在主站台之前，且 certbot 不會碰它（沒有可簽的 server_name）。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # 另開一份 log：fail2ban 的 avalo-honeypath jail 把 access.log 裡的 444 視為
    # 「探測 .env 之類路徑」的鐵證而一擊即封，Host 亂送屬於不同性質，不該混進去。
    access_log /var/log/nginx/rejected.log;
    return 444;
}
# HTTPS 的同款防護。ssl_reject_handshake（nginx 1.19.4+）讓這個 server 不需要憑證，
# 直接在 TLS 交握階段拒絕，所以未簽發憑證的子網域不會意外拿到主站的憑證與內容。
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    # 客戶站掛在 *.YOUR_DOMAIN 子網域（由 Next 的 src/proxy.ts 依 Host 改寫路由）。
    # 憑證仍需逐一簽發，見 deploy/domains.txt。
    server_name YOUR_DOMAIN www.YOUR_DOMAIN *.YOUR_DOMAIN;

    server_tokens off;
    client_max_body_size 2m;

    # HTTP/2：一條連線多工，取代 HTTP/1.1 每個訪客開 6 條的行為。
    # 除了本身較快，也大幅降低 limit_conn 誤擋真實使用者的機率。
    # nginx 1.25.1 起用獨立指令，不再寫在 listen 後面。
    http2 on;

    # 被限流時回 429（預設 503 會讓正常使用者以為網站掛了，也不利於 fail2ban 判讀）
    limit_req_status 429;
    limit_conn_status 429;
    # 上限 40：HTTP/1.1 的瀏覽器每站約開 6 條，多開幾個分頁就會逼近 20，
    # 而 fail2ban 的 nginx-limit-req filter 連「連線數超限」也會計數，20 太容易誤傷。
    limit_conn avalo_conn 40;

    # 逾時收緊：擋 slowloris，並縮短 keep-alive 讓封鎖 IP 後舊連線盡快斷開
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # 只接受實際會用到的方法
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # 安全標頭（HSTS 由 certbot 啟用 HTTPS 後生效才有意義，先行加上）
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP：擋跨站腳本注入。
    # 這裡刻意「不」用 nonce 版——Next 的 nonce CSP 會強制所有頁面改成動態渲染，
    # 等於廢掉 SSG 與邊緣快取，t3.micro 撐不起（見 Next 文件 content-security-policy）。
    # 代價是必須留 'unsafe-inline'（Next 的 hydration 內嵌 script 需要），
    # 但外部來源的腳本、物件、iframe 內嵌本站，仍然全部擋掉。
    # form-action 必須放行綠界，否則付款導轉會被擋。
    # 2026-07-30 已用 Report-Only 實測首頁／文山（three.js）／估價單／結帳皆零違規後轉正式。
    # 綠界導轉頁（/api/pay/[mtn]）是自動送出的表單，程式碼裡所有可能的 action URL
    # 都落在下面這兩個網域內，已驗證不會被擋。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://payment.ecpay.com.tw https://payment-stage.ecpay.com.tw; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # 掃描路徑一律 444。規則本體在 snippet 裡，因為 certbot 產生的 :80 導轉站台
    # 也必須掛同一份（見檔案末尾的說明與 deploy/nginx-scan-block.conf）。
    include /etc/nginx/snippets/avalo-scan-block.conf;

    # 綠界回呼不能被速率限制誤殺，獨立放行
    location /api/ecpay/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 表單／寫庫類端點：會寄信、會寫庫，限得比其他 API 嚴（app 層另有 honeypot＋per-IP 限流）。
    # checkout 與 order-lookup 也納入：前者每次呼叫寫 Order＋Payment（＋Subscription），
    # 落在通用 5r/s 桶等於每天可灌 43 萬筆進 SQLite；後者是訂單編號的暴力猜測面。
    location ~ ^/api/(contact|wenshan/quote|checkout|order-lookup)$ {
        limit_req zone=avalo_form burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=avalo_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next 靜態資源（雜湊檔名）
    # 不再自己加 Cache-Control：Next 本來就會發 immutable，兩邊都加會出現重複標頭，
    # 而且 nginx 的規則是「本層一旦有 add_header 就不繼承上層」，加了會讓這個 location
    # 失去 server 層的所有安全標頭。
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location / {
        # burst 放寬到 60：Next.js 開頁時會一次預抓一整批 _rsc 連結，
        # burst=20 會把正常使用者的預抓打成 429，再被 fail2ban 誤判成攻擊。
        # 2026-07-30 實測 Barry 瀏覽後台，一分鐘 71 個請求中有 13 個被擋。
        limit_req zone=avalo_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# 跑過 `certbot --nginx` 之後要補的一件事
#
# certbot 會把上面這個 server 改成 :443，另外「新產生」一個 :80 的導轉站台：
#
#     server {
#         listen 80;
#         listen [::]:80;
#         server_name avalokite.xyz www.avalokite.xyz *.avalokite.xyz;
#         location / { return 301 https://$host$request_uri; }
#     }
#
# 那個新站台不會帶上面的任何規則，所以必須手動把掃描攔截補進去
# （regex location 的優先序高於 location /，會先命中）：
#
#         include /etc/nginx/snippets/avalo-scan-block.conf;
#
# 沒補的話，:80 的探測只會拿到 301，access.log 記 301 而非 444，
# fail2ban 的 avalo-honeypath 就抓不到它。2026-08-26 修正，成因見 snippet 內的註解。
# 這裡不能直接寫成第二個 server 區塊——certbot 跑之前會與上面的 server_name 撞名。
# ─────────────────────────────────────────────────────────────────────────────
