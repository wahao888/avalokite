# Avalo — Nginx 反向代理（certbot 會自動補上 443/SSL 區塊）
# 速率限制：一般頁面 10r/s、API 5r/s、表單 6r/min（表單那層是 2026-07-30 灌信事件後加的）
limit_req_zone $binary_remote_addr zone=avalo_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=avalo_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=avalo_form:10m rate=6r/m;
# 單一 IP 併發連線上限（擋 slowloris 與連線池洗版）
limit_conn_zone $binary_remote_addr zone=avalo_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    server_tokens off;
    client_max_body_size 2m;

    # 被限流時回 429（預設 503 會讓正常使用者以為網站掛了，也不利於 fail2ban 判讀）
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn avalo_conn 20;

    # 逾時收緊：擋 slowloris，並縮短 keep-alive 讓封鎖 IP 後舊連線盡快斷開
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # 只接受實際會用到的方法
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # 安全標頭（HSTS 由 certbot 啟用 HTTPS 後生效才有意義，先行加上）
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 常見掃描路徑直接斷線（444＝不回應直接關連線，比 404 省資源也不餵資訊給掃描器）
    # 注意：/admin 是本站真實路由，不可加進來
    location ~* ^/(wp-admin|wp-login|wp-content|xmlrpc\.php|phpmyadmin|\.env|\.git|\.aws|vendor/|cgi-bin/|autodiscover) {
        return 444;
    }

    # 綠界回呼不能被速率限制誤殺，獨立放行
    location /api/ecpay/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 表單類端點：會寄信、會寫庫，限得比其他 API 嚴（app 層另有 honeypot＋10 分鐘 5 次）
    location ~ ^/api/(contact|wenshan/quote)$ {
        limit_req zone=avalo_form burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=avalo_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next 靜態資源長快取
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=avalo_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
