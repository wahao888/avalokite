<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿瓦羅 品牌動畫短片</title>
<meta name="description" content="Avalo 阿瓦羅全服務的 9:16 3D 卡通動畫短片，約 63 秒，含旁白、字幕與配樂。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Noto+Serif+TC:wght@700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- 時間軸由 build/make-vo.py 依旁白實際長度產生 -->
<script src="build/timeline.js"></script>
<!-- three.js 由 build/serve.js 從專案根目錄的 node_modules 提供（ES module 不能用 file:// 開） -->
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
<style>
:root{
  --paper:#F0EBE3; --cream:#E4DCCF; --wood:#A98467; --walnut:#7A5C44; --sage:#8A9A7B; --moss:#5F7155;
  --moss-deep:#3F4D39; --ink:#2F2B26; --muted:#8C8478; --green:#06C755;
  --serif:"Noto Serif TC","Songti TC",serif;
  --sans:"PingFang TC",-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  --num:"Fraunces","Noto Serif TC",serif; --mono:"DM Mono","Courier New",monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0c0b0a;font-family:var(--sans);overflow:hidden;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;overflow:hidden;
  background:#0f0e12;box-shadow:0 40px 120px rgba(0,0,0,.6)}
#glwrap,#sky,#gl{position:absolute;inset:0;width:1080px;height:1920px}
#gl{display:block}
/* 暗角：把視線收到畫面中間 */
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 78% at 50% 44%,transparent 55%,rgba(20,16,12,.38) 100%)}
#fadein{position:absolute;inset:0;background:#0f0e12;pointer-events:none;z-index:300}
.ov{position:absolute;inset:0;pointer-events:none;z-index:100}
.cx{position:absolute;left:0;right:0;text-align:center}

/* 版面安全區：IG 上方約 200px、下方約 420px 會被介面蓋住 */
.a-up,.a-in,.a-pop,.a-stamp,.a-draw{animation-fill-mode:both;animation-timing-function:cubic-bezier(.16,.84,.3,1)}
.a-up{animation-name:up;animation-duration:.75s}
.a-in{animation-name:fin;animation-duration:.6s;animation-timing-function:linear}
.a-pop{animation-name:pop;animation-duration:.6s;animation-timing-function:cubic-bezier(.2,1.6,.4,1)}
.a-stamp{animation-name:stamp;animation-duration:.42s;animation-timing-function:cubic-bezier(.3,1.4,.5,1)}
@keyframes up{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes stamp{from{opacity:0;transform:rotate(-7deg) scale(2.6)}to{opacity:1;transform:rotate(-7deg) scale(1)}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* 每一幕上方的服務名稱：一個編號＋一個詞，其他都交給畫面 */
.title{top:214px}
.title>span{display:inline-flex;align-items:center;gap:22px;background:rgba(240,235,227,.94);color:var(--ink);
  padding:16px 44px 18px 18px;border-radius:99px;box-shadow:0 18px 44px rgba(20,16,12,.28);
  font-family:var(--serif);font-weight:900;font-size:68px;letter-spacing:.04em}
.title b{width:88px;height:88px;border-radius:50%;background:var(--moss);color:#fff;font-family:var(--num);font-weight:600;
  font-size:42px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0}
.title em{font-style:normal;color:#05A648}

/* 結尾前：三個階段與價格 */
.steps{top:214px;display:flex;justify-content:center;align-items:center;gap:16px}
.steps span{background:rgba(240,235,227,.95);color:var(--ink);font-family:var(--serif);font-weight:900;font-size:60px;
  padding:14px 38px 18px;border-radius:99px;box-shadow:0 16px 40px rgba(20,16,12,.26)}
.steps i{font-style:normal;color:#fff;font-size:50px;font-weight:700;text-shadow:0 4px 14px rgba(0,0,0,.4)}
.stampbox{position:absolute;left:50%;top:372px;margin-left:-330px;width:660px;text-align:center;font-family:var(--serif);
  font-weight:900;font-size:104px;color:#fff;background:var(--green);padding:10px 0 20px;border-radius:30px;letter-spacing:.08em;
  box-shadow:0 22px 50px rgba(6,199,85,.45);transform:rotate(-7deg)}

/* 片尾 */
.end .logo{top:330px}
.end .logo circle,.end .logo path{stroke-dasharray:var(--len);animation:draw 1.1s cubic-bezier(.4,0,.2,1) both}
.end .name{top:640px;font-family:var(--serif);font-weight:900;font-size:128px;color:#fff;letter-spacing:.05em;text-shadow:0 10px 40px rgba(0,0,0,.35)}
.end .name small{display:block;font-family:var(--mono);font-weight:400;font-size:34px;letter-spacing:.5em;color:#C7D3BA;margin-bottom:10px;text-indent:.5em}
.end .line1{top:880px;font-family:var(--serif);font-weight:700;font-size:62px;color:#F0EBE3;line-height:1.45;text-shadow:0 6px 26px rgba(0,0,0,.4)}
.end .line1 em{font-style:normal;color:#5EEA93}
.end .chips{top:1085px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px;padding:0 90px}
.end .chips span{font-size:33px;font-weight:600;color:#F0EBE3;border:2px solid rgba(240,235,227,.42);padding:9px 24px 11px;border-radius:99px;
  background:rgba(20,16,12,.28)}
.end .url{top:1262px}
.end .fine{top:1420px;font-size:31px;letter-spacing:.08em;color:rgba(240,235,227,.78)}
.end .url span{display:inline-block;background:var(--paper);color:var(--moss-deep);font-family:var(--num);font-weight:600;font-size:66px;
  padding:16px 56px 22px;border-radius:99px;box-shadow:0 24px 56px rgba(0,0,0,.35);animation:breathe 1.8s ease-in-out infinite}

/* 字幕 */
#caps{position:absolute;left:0;right:0;top:1372px;height:140px;z-index:200;pointer-events:none}
.cap{position:absolute;left:50%;top:50%;translate:-50% -50%;white-space:nowrap;opacity:0;background:rgba(16,14,12,.86);color:#fff;
  font-size:58px;font-weight:700;letter-spacing:.03em;padding:22px 44px 24px;border-radius:30px;box-shadow:0 16px 40px rgba(0,0,0,.28)}
.cap em{font-style:normal;color:#5EEA93}
.cap em.w{color:#FF8A7E}

#ui{position:fixed;left:0;right:0;bottom:0;padding:14px 18px;display:flex;gap:10px;align-items:center;background:rgba(20,18,15,.88);
  font-family:var(--mono);font-size:12px;color:#C9C1B2;z-index:500}
#ui button{font-family:var(--mono);font-size:12px;padding:8px 14px;border:1px solid #4a443c;background:#241f1a;color:#E7E1D6;cursor:pointer}
#track{flex:1;height:6px;background:#332c25;cursor:pointer;position:relative}
#fill{position:absolute;inset:0;right:auto;width:0;background:var(--green)}
body.record #ui{display:none}
body.record{background:#000}
body.record #stage{box-shadow:none}
</style>
</head>
<body>
<div id="stage">
  <div id="glwrap"><div id="sky"></div><canvas id="gl" width="1080" height="1920"></canvas><div id="vig"></div></div>

  <div class="ov" data-scene="website"><div class="cx title a-pop" data-at="@build-.1" data-out="end-.35"><span><b>01</b>品牌官網</span></div></div>
  <div class="ov" data-scene="shop"><div class="cx title a-pop" data-at="@cart-.5" data-out="end-.35"><span><b>02</b>電商・金流</span></div></div>
  <div class="ov" data-scene="ai"><div class="cx title a-pop" data-at="@ask-.1" data-out="end-.35"><span><b>03</b><em>LINE</em> AI 客服</span></div></div>
  <div class="ov" data-scene="auto"><div class="cx title a-pop" data-at=".35" data-out="end-.35"><span><b>04</b>AI 自動化</span></div></div>
  <div class="ov" data-scene="geo"><div class="cx title a-pop" data-at="@google-.4" data-out="end-.35"><span><b>05</b>搜尋・GEO</span></div></div>
  <div class="ov" data-scene="care"><div class="cx title a-pop" data-at="@live-.2" data-out="end-.35"><span><b>06</b>維護代管</span></div></div>

  <div class="ov" data-scene="finale">
    <div class="cx steps" data-out="end-.3">
      <span class="a-pop" data-at=".5">設計</span><i class="a-in" data-at=".9">→</i>
      <span class="a-pop" data-at="1.1">開發</span><i class="a-in" data-at="1.5">→</i>
      <span class="a-pop" data-at="1.7">維運</span>
    </div>
    <div data-out="end-.3" style="position:absolute;inset:0"><div class="stampbox a-stamp" data-at="@fixed+.1">不二價</div></div>
  </div>

  <div class="ov end" data-scene="cta">
    <div class="cx logo">
      <svg width="270" height="270" viewBox="-36 -36 72 72" fill="none" stroke-linecap="round">
        <circle r="30" stroke="#F0EBE3" stroke-width="1.9" style="--len:189" data-at="@brand-.2" transform="rotate(-30)" opacity=".92"/>
        <circle r="23" stroke="#C7D3BA" stroke-width="1.9" style="--len:145" data-at="@brand+0" transform="rotate(40)" opacity=".9"/>
        <circle r="16" stroke="#E4DCCF" stroke-width="1.9" style="--len:101" data-at="@brand+.2" transform="rotate(160)" opacity=".85"/>
        <path d="M-9,13 L0,-13 L9,13" stroke="#fff" stroke-width="4" stroke-linejoin="round" style="--len:56" data-at="@brand+.45"/>
        <path d="M-5.2,4.5 Q0,1.5 5.2,4.5" stroke="#fff" stroke-width="4" style="--len:12" data-at="@brand+.9"/>
      </svg>
    </div>
    <div class="cx name a-up" data-at="@brand+.5"><small>AVALO</small>阿瓦羅</div>
    <div class="cx line1 a-up" data-at="@focus-.1">你專心做生意，<br>其他的，<em>交給我們</em></div>
    <div class="cx chips">
      <span class="a-pop" data-at="@rest+.5">品牌官網</span><span class="a-pop" data-at="@rest+.58">電商金流</span><span class="a-pop" data-at="@rest+.66">LINE AI 客服</span>
      <span class="a-pop" data-at="@rest+.74">AI 自動化</span><span class="a-pop" data-at="@rest+.82">搜尋 GEO</span><span class="a-pop" data-at="@rest+.9">維護代管</span>
    </div>
    <div class="cx url a-pop" data-at="@rest+1.1"><span>avalokite.xyz</span></div>
    <div class="cx fine a-in" data-at="@rest+1.5">價格全部公開・不二價　｜　LINE @958nplck</div>
  </div>

  <div id="caps"></div>
  <div id="fadein"></div>
</div>

<div id="ui">
  <button id="replay">↻ 重播</button>
  <button id="rec">● 錄影模式</button>
  <div id="track"><div id="fill"></div></div>
  <span id="clock"></span>
</div>
<audio id="aud" src="build/audio.m4a" preload="auto"></audio>
<script type="module" src="src/main.js"></script>
</body>
</html>
