<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿瓦羅 手繪風廣告短片</title>
<meta name="description" content="Avalo 阿瓦羅的 9:16 平面手繪風廣告短片：老闆的待辦清單被一件件劃掉。約 57 秒，含旁白、字幕與配樂。">
<!-- 時間軸由 build/make-vo.py 依旁白實際長度產生 -->
<script src="build/timeline.js"></script>
<style>
:root{
  --ink:#2B2722; --paper:#F3ECDF; --green:#12B55A;
  /* 手寫字：翩翩體寫標題與清單，手札體寫字幕（筆畫比較穩，小字好讀）。兩者都是 macOS 內建 */
  --hand:"HanziPen TC","Hannotate TC","Kaiti TC",cursive;
  --note:"Hannotate TC","HanziPen TC","PingFang TC",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0c0b0a;overflow:hidden;color:var(--ink);font-family:var(--note)}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;overflow:hidden;
  background:var(--paper);box-shadow:0 40px 120px rgba(0,0,0,.6)}
/* 筆記本的紙：橫線、左邊一條紅色的邊界線、再疊一層紙的顆粒 */
#paper{position:absolute;inset:0;
  background:
    linear-gradient(90deg,transparent 104px,rgba(232,115,90,.5) 104px,rgba(232,115,90,.5) 108px,transparent 108px),
    repeating-linear-gradient(180deg,transparent 0,transparent 124px,rgba(110,146,170,.3) 124px,rgba(110,146,170,.3) 127px,transparent 127px,transparent 128px);
  background-position:0 0,0 12px}
#grain{position:absolute;inset:0;width:1080px;height:1920px;opacity:.5;mix-blend-mode:multiply;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 45%,transparent 58%,rgba(90,70,40,.2) 100%)}
/* 所有手繪的東西都在這一層，整層套「抖動」濾鏡：線條每 1/6 秒換一次微小的變形，
   就是手繪動畫一張一張重畫時線會抖的那個感覺 */
#art{position:absolute;inset:0;filter:url(#boil)}
#svg,#txt,#txt2{position:absolute;inset:0;width:1080px;height:1920px}
#txt div.t,#txt2 div.t{position:absolute;white-space:nowrap;font-family:var(--hand);line-height:1.15;color:var(--ink)}

.bob{animation:bob 1.7s ease-in-out infinite}
.bob2{animation:bob 2.1s ease-in-out infinite reverse}
.spin{animation:spin 7s linear infinite}
.spinr{animation:spin 5s linear infinite reverse}
.wig{animation:wig 1s ease-in-out infinite}
.pulse{animation:pulse 1.3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wig{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* 字幕：一張貼上去的紙條，強調的字用螢光筆畫過 */
#caps{position:absolute;left:0;right:0;top:1372px;height:150px;z-index:200;pointer-events:none}
.cap{position:absolute;left:50%;top:50%;translate:-50% -50%;rotate:-1.2deg;white-space:nowrap;opacity:0;
  background:#FFFDF7;color:var(--ink);font-family:var(--note);font-weight:700;font-size:60px;letter-spacing:.04em;
  padding:20px 46px 24px;border:5px solid var(--ink);border-radius:18px 26px 16px 28px/26px 16px 28px 18px;
  box-shadow:8px 9px 0 rgba(43,39,34,.9)}
.cap em{font-style:normal;background:linear-gradient(transparent 52%,rgba(18,181,90,.5) 52%,rgba(18,181,90,.5) 94%,transparent 94%);padding:0 4px}
.cap em.w{background:linear-gradient(transparent 52%,rgba(238,138,114,.6) 52%,rgba(238,138,114,.6) 94%,transparent 94%)}

#ui{position:fixed;left:0;right:0;bottom:0;padding:14px 18px;display:flex;gap:10px;align-items:center;background:rgba(20,18,15,.88);
  font-family:monospace;font-size:12px;color:#C9C1B2;z-index:500}
#ui button{font-family:monospace;font-size:12px;padding:8px 14px;border:1px solid #4a443c;background:#241f1a;color:#E7E1D6;cursor:pointer}
#track{flex:1;height:6px;background:#332c25;cursor:pointer;position:relative}
#fill{position:absolute;inset:0;right:auto;width:0;background:var(--green)}
body.record #ui{display:none}
body.record{background:#000}
body.record #stage{box-shadow:none}
</style>
</head>
<body>
<div id="stage">
  <div id="paper"></div>
  <svg id="grain"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .5 -.12"/></filter><rect width="1080" height="1920" filter="url(#gr)"/></svg>
  <div id="art">
    <div id="txt"></div>
    <svg id="svg" viewBox="0 0 1080 1920" fill="none" stroke-linecap="round" stroke-linejoin="round"></svg>
    <div id="txt2"></div>
  </div>
  <div id="vig"></div>
  <div id="caps"></div>
  <svg width="0" height="0" style="position:absolute">
    <filter id="boil" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="1" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
</div>
<div id="ui">
  <button id="replay">↻ 重播</button>
  <button id="rec">● 錄影模式</button>
  <div id="track"><div id="fill"></div></div>
  <span id="clock"></span>
</div>
<audio id="aud" src="build/audio.m4a" preload="auto"></audio>

<script>
const TL = window.TL, TOTAL = TL.total;
const SC = Object.fromEntries(TL.scenes.map(s => [s.id, s]));
const stage = document.getElementById("stage"), svg = document.getElementById("svg"), txt = document.getElementById("txt"), txt2 = document.getElementById("txt2");
const NS = "http://www.w3.org/2000/svg";
const INK = "#2B2722", GREEN = "#12B55A", MOSS = "#5F7155", SAGE = "#B9CBA6", WOOD = "#DDB790", CORAL = "#EE8A72",
      BUTTER = "#F6D878", SKY = "#BFE0EE", WHITE = "#FFFDF7", LGREEN = "#A8E6B8";
const HAND = "cubic-bezier(.4,0,.3,1)";      // 下筆慢、中間快、收筆慢

/* ── 固定的亂數：每次渲染畫出來的「手抖」都一樣 ── */
let _s = 20261112;
const rnd = () => { _s |= 0; _s = _s + 0x6D2B79F5 | 0; let t = Math.imul(_s ^ _s >>> 15, 1 | _s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const jit = a => (rnd() * 2 - 1) * a;

/* ── 手繪的線：端點不準、線有一點弓、同一條線描兩次 ── */
function polyD(pts, closed, r = 2.6) {
  const P = pts.map(([x, y]) => [x + jit(r), y + jit(r)]);
  if (closed) P.push([P[0][0] + jit(r), P[0][1] + jit(r)]);
  let d = `M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
  for (let i = 1; i < P.length; i++) {
    const a = P[i - 1], b = P[i], L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    const nx = -(b[1] - a[1]) / L, ny = (b[0] - a[0]) / L, bow = jit(Math.min(7, L * 0.028));
    const c1 = [a[0] + (b[0] - a[0]) * 0.35 + nx * bow, a[1] + (b[1] - a[1]) * 0.35 + ny * bow];
    const c2 = [a[0] + (b[0] - a[0]) * 0.7 + nx * bow * 0.6, a[1] + (b[1] - a[1]) * 0.7 + ny * bow * 0.6];
    d += `C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
  }
  return d;
}
/* 穿過一串點的平滑曲線（Catmull-Rom 轉貝茲） */
function smoothD(pts, r = 1.6) {
  const P = pts.map(([x, y]) => [x + jit(r), y + jit(r)]);
  let d = `M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
    d += `C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}
/* 手畫的圓：半徑忽大忽小，收尾多畫一小段蓋過起點 */
function ellPts(cx, cy, rx, ry, over = 2) {
  const n = 16, a0 = rnd() * 6.28, out = [];
  for (let k = 0; k <= n + over; k++) { const a = a0 + (k / n) * Math.PI * 2, q = 1 + jit(0.028); out.push([cx + Math.cos(a) * rx * q, cy + Math.sin(a) * ry * q]); }
  return out;
}

/* ── 時間 ── */
function at(id, v) {
  if (typeof v === "number") return SC[id].start + v;
  const m = /^@(\w+)([+-][\d.]+)?$/.exec(String(v).trim());
  if (m) { if (!(m[1] in SC[id].cues)) throw new Error(`第 ${id} 幕沒有 cue「${m[1]}」`); return SC[id].start + SC[id].cues[m[1]] + (m[2] ? +m[2] : 0); }
  const e = /^end([+-][\d.]+)?$/.exec(String(v).trim());
  if (e) return SC[id].start + SC[id].dur + (e[1] ? +e[1] : 0);
  return SC[id].start + +v;
}
const W = (el, kf, t, dur, ease = "ease-out", n = 1) => el.animate(kf, { delay: t * 1000, duration: dur * 1000, fill: "forwards", easing: ease, iterations: n });
const SFX = [];

/* ── 一幕的畫布：所有畫圖的方法都掛在這上面 ── */
class Ctx {
  constructor(id, g, h, h2) { this.id = id; this.g = g; this.h = h; this.h2 = h2; }
  T(v) { return at(this.id, v); }
  sfx(name, v, d) { SFX.push({ t: +this.T(v).toFixed(3), name, ...(d ? { d } : {}) }); return this; }
  /** 子群組：拿來做「整組一起動」的循環動畫（轉、晃、上下漂） */
  sub(cls, ox, oy) { const g = document.createElementNS(NS, "g"); if (cls) g.setAttribute("class", cls); g.style.transformOrigin = `${ox}px ${oy}px`; this.g.appendChild(g); return new Ctx(this.id, g, this.h, this.h2); }
  /** 一筆畫：路徑先藏起來（dashoffset = 全長），到時間再一路畫出來 */
  stroke(d, o = {}) {
    const { at: a = 0, d: dur = 0.5, w = 7, col = INK, op = 1, twice = true } = o;
    for (let pass = 0; pass < (twice ? 2 : 1); pass++) {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", typeof d === "function" ? d() : d);
      p.setAttribute("stroke", col); p.setAttribute("stroke-width", pass ? w * 0.72 : w); p.setAttribute("opacity", pass ? op * 0.5 : op);
      this.g.appendChild(p);
      const len = p.getTotalLength() + 2;
      p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      W(p, [{ strokeDashoffset: len }, { strokeDashoffset: 0 }], this.T(a) + pass * 0.05, dur, HAND);
    }
    return this;
  }
  line(pts, o = {}) { return this.stroke(() => polyD(pts, o.close, o.r), o); }
  curve(pts, o = {}) { return this.stroke(() => smoothD(pts, o.r), o); }
  /** 色塊：故意跟外框錯開幾個像素，像麥克筆塗到線外面 */
  fill(d, col, a, o = {}) {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d); p.setAttribute("fill", col); p.setAttribute("stroke", "none");
    p.setAttribute("transform", `translate(${o.dx ?? 7} ${o.dy ?? 8})`); p.style.mixBlendMode = o.blend ?? "multiply"; p.style.opacity = 0;
    this.g.insertBefore(p, o.under ?? null);
    W(p, [{ opacity: 0 }, { opacity: o.op ?? 0.92 }], this.T(a), 0.28);
    return this;
  }
  rect(x, y, w, h, o = {}) {
    const pts = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
    if (o.fill) this.fill(polyD(pts, true, 3) + "Z", o.fill, this.rel(o.at, (o.d ?? 0.5) * 0.75), o);
    if (o.hatch) this.hatch(x, y, w, h, o.hatch, this.rel(o.at, (o.d ?? 0.5) * 0.6));
    return o.nostroke ? this : this.line(pts, { ...o, close: true });
  }
  ell(cx, cy, rx, ry = rx, o = {}) {
    if (o.fill) this.fill(smoothD(ellPts(cx, cy, rx, ry, 0)) + "Z", o.fill, this.rel(o.at, (o.d ?? 0.5) * 0.75), o);
    return o.nostroke ? this : this.stroke(() => smoothD(ellPts(cx, cy, rx, ry)), o);
  }
  shape(pts, o = {}) {                 // 封閉的多邊形，可上色
    if (o.fill) this.fill(polyD(pts, true, 3) + "Z", o.fill, this.rel(o.at, (o.d ?? 0.5) * 0.75), o);
    return this.line(pts, { ...o, close: true });
  }
  blob(pts, o = {}) {                  // 封閉的圓滑形狀，可上色
    const closed = [...pts, pts[0], pts[1]];
    if (o.fill) this.fill(smoothD([...pts, pts[0]]) + "Z", o.fill, this.rel(o.at, (o.d ?? 0.5) * 0.75), o);
    return this.stroke(() => smoothD(closed), o);
  }
  /** 斜線塗色：一條一條畫上去 */
  hatch(x, y, w, h, col, a, gap = 24) {
    let i = 0;
    for (let c = x - h + gap / 2; c < x + w; c += gap) {
      const x1 = Math.max(c, x), x2 = Math.min(c + h, x + w);
      if (x2 - x1 < 6) continue;
      this.stroke(polyD([[x1, y + h - (x1 - c)], [x2, y + h - (x2 - c)]], false, 2), { at: this.rel(a, i * 0.025), d: 0.16, w: 6, col, op: 0.85, twice: false });
      i++;
    }
    return this;
  }
  rel(v, plus) { return this.T(v ?? 0) - SC[this.id].start + plus; }     // 把任何時間寫法換成「進場後幾秒」
  /** 手寫字：從左到右寫出來 */
  text(str, x, y, size, o = {}) {
    const el = document.createElement("div"); el.className = "t"; el.textContent = str;
    el.style.cssText = `left:${x}px;top:${y}px;font-size:${size}px;color:${o.col ?? INK};font-weight:${o.weight ?? 400};` +
      (o.font ? `font-family:${o.font};` : "") + (o.anchor === "middle" ? "translate:-50% 0;" : "") + (o.rot ? `rotate:${o.rot}deg;` : "") + (o.ls ? `letter-spacing:${o.ls};` : "");
    el.style.clipPath = "inset(-12% 100% -12% -6%)";
    (o.under ? this.h : this.h2).appendChild(el);      // under：寫在線條下面，才能被麥克筆劃掉
    W(el, [{ clipPath: "inset(-12% 100% -12% -6%)" }, { clipPath: "inset(-12% -6% -12% -6%)" }], this.T(o.at ?? 0), o.d ?? Math.max(0.25, str.length * 0.075), "linear");
    return el;
  }
  /** 整組東西掉下來／彈出來 */
  drop(v, dy = -260) { this.g.style.opacity = 0; W(this.g, [{ opacity: 0, transform: `translateY(${dy}px)` }, { opacity: 1, transform: "translateY(18px)", offset: 0.7 }, { opacity: 1, transform: "none" }], this.T(v), 0.5, "cubic-bezier(.3,0,.4,1)"); return this; }
  pop(v) { this.g.style.opacity = 0; W(this.g, [{ opacity: 0, transform: "scale(.3)" }, { opacity: 1, transform: "scale(1.15)", offset: 0.7 }, { opacity: 1, transform: "scale(1)" }], this.T(v), 0.38); return this; }
  /** 四角星 */
  star(cx, cy, r, o = {}) { const k = r * 0.3; return this.shape([[cx, cy - r], [cx + k, cy - k], [cx + r, cy], [cx + k, cy + k], [cx, cy + r], [cx - k, cy + k], [cx - r, cy], [cx - k, cy - k]], { w: 5, d: 0.3, fill: BUTTER, ...o }); }
}

function scene(id, build) {
  const g = document.createElementNS(NS, "g"), h = document.createElement("div"), h2 = document.createElement("div");
  g.style.opacity = 0; [h, h2].forEach(el => { el.style.cssText = "opacity:0;position:absolute;inset:0"; });
  svg.appendChild(g); txt.appendChild(h); txt2.appendChild(h2);
  const s = SC[id], last = id === TL.scenes[TL.scenes.length - 1].id;
  [g, h, h2].forEach(el => {
    W(el, [{ opacity: 0 }, { opacity: 1 }], s.start, 0.1);
    if (!last) W(el, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateX(-60px)" }], s.start + s.dur - 0.24, 0.22, "ease-in");   // 翻頁
  });
  if (id !== TL.scenes[0].id) SFX.push({ t: +(s.start - 0.12).toFixed(3), name: "page" });
  build(new Ctx(id, g, h, h2));
}

/* ── 共用的小圖 ── */
const ITEMS = ["做官網", "接訂單、收款", "回 LINE 訊息", "做報表、跑流程", "讓客人找得到", "顧網站"];
/** 打勾＋劃掉：綠色麥克筆 */
function crossOut(c, v, x, y, box, textW, size) {
  c.line([[x + box * 0.12, y + box * 0.5], [x + box * 0.42, y + box * 0.9], [x + box * 1.15, y - box * 0.3]], { at: v, d: 0.28, w: box * 0.2, col: GREEN, r: 2 });
  c.line([[x + box + 22, y + size * 0.62], [x + box + 60 + textW, y + size * 0.52]], { at: c.rel(v, 0.2), d: 0.34, w: size * 0.17, col: GREEN, op: 0.82, twice: false });
}
/** 功能幕的頁首：清單上的那一項，放大寫在最上面，講到的時候劃掉 */
function header(c, n) {
  const x = 150, y = 262, box = 86, size = 100;
  c.rect(x, y + 20, box, box, { at: 0.08, d: 0.35, w: 8 });
  const el = c.text(ITEMS[n], x + box + 36, y, size, { at: 0.16, d: 0.45, under: true });
  c.sfx("pencil", 0.1, 0.5);
  crossOut(c, "@done", x, y + 20, box, el.offsetWidth, size);
  c.sfx("check", "@done").sfx("marker", "@done+.2");
  c.ell(930, 225, 62, 46, { at: 0.3, d: 0.3, w: 5 });
  c.text(`${n + 1}/6`, 930, 192, 50, { at: 0.35, d: 0.2, anchor: "middle" });
}
/** 老闆：一顆頭、一撮頭髮、圍裙。mood 決定表情 */
function owner(c, cx, cy, mood, t0) {
  c.ell(cx, cy, 78, 76, { at: t0, d: 0.5, fill: "#F8DCC4" });
  c.curve([[cx - 76, cy - 22], [cx - 50, cy - 82], [cx, cy - 96], [cx + 54, cy - 80], [cx + 78, cy - 20], [cx + 40, cy - 52], [cx - 10, cy - 44], [cx - 46, cy - 56], [cx - 76, cy - 22]], { at: t0 + 0.3, d: 0.5, w: 7 });
  c.fill(smoothD([[cx - 76, cy - 22], [cx - 50, cy - 82], [cx, cy - 96], [cx + 54, cy - 80], [cx + 78, cy - 20], [cx + 40, cy - 52], [cx - 10, cy - 44], [cx - 46, cy - 56]]) + "Z", "#8A6A52", t0 + 0.65);
  c.blob([[cx - 120, cy + 190], [cx - 96, cy + 104], [cx, cy + 78], [cx + 96, cy + 104], [cx + 120, cy + 190]], { at: t0 + 0.55, d: 0.5, fill: mood > 0 ? LGREEN : "#D9D2C4" });
  if (mood > 0) {
    c.curve([[cx - 46, cy - 6], [cx - 30, cy - 22], [cx - 14, cy - 6]], { at: t0 + 0.8, d: 0.15, w: 7 });
    c.curve([[cx + 14, cy - 6], [cx + 30, cy - 22], [cx + 46, cy - 6]], { at: t0 + 0.9, d: 0.15, w: 7 });
    c.curve([[cx - 34, cy + 22], [cx, cy + 52], [cx + 34, cy + 22]], { at: t0 + 1.0, d: 0.2, w: 7 });
    c.ell(cx - 50, cy + 22, 13, 9, { at: t0 + 1.1, d: 0.1, nostroke: true, fill: CORAL, op: 0.6 }); c.ell(cx + 50, cy + 22, 13, 9, { at: t0 + 1.1, d: 0.1, nostroke: true, fill: CORAL, op: 0.6 });
  } else {
    c.line([[cx - 48, cy - 8], [cx - 16, cy - 2]], { at: t0 + 0.8, d: 0.12, w: 7 }); c.line([[cx + 16, cy - 2], [cx + 48, cy - 8]], { at: t0 + 0.9, d: 0.12, w: 7 });
    c.curve([[cx - 30, cy + 38], [cx - 14, cy + 28], [cx, cy + 38], [cx + 14, cy + 28], [cx + 30, cy + 38]], { at: t0 + 1.0, d: 0.25, w: 6 });
  }

function gear(c, cx, cy, ro, ri, teeth, o) {
  const pts = [];
  for (let i = 0; i < teeth; i++) {
    const a = (i / teeth) * Math.PI * 2, s = Math.PI * 2 / teeth;
    [[a, ri], [a + s * 0.14, ro], [a + s * 0.42, ro], [a + s * 0.56, ri]].forEach(([q, r]) => pts.push([cx + Math.cos(q) * r, cy + Math.sin(q) * r]));
  }
  c.shape(pts, o); c.ell(cx, cy, ri * 0.36, ri * 0.36, { at: c.rel(o.at, 0.5), d: 0.2, w: o.w - 1, fill: WHITE });
}

/* ── 字幕 ── */
(() => {
  const box = document.getElementById("caps");
  TL.captions.forEach((cp, i) => {
    const el = document.createElement("div"); el.className = "cap";
    el.innerHTML = cp.text.replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/~(.+?)~/g, '<em class="w">$1</em>');
    box.appendChild(el);
    const nxt = TL.captions[i + 1], out = nxt ? Math.min(cp.end, nxt.start) : cp.end;
    el.animate([{ opacity: 0, transform: "translateY(18px) scale(.94)" }, { opacity: 1, transform: "none" }], { delay: cp.start * 1000, duration: 140, fill: "forwards", easing: "ease-out" });
    el.animate([{ opacity: 1 }, { opacity: 0 }], { delay: out * 1000, duration: 1, fill: "forwards" });
  });
})();

SFX.sort((a, b) => a.t - b.t);
window.SFX = SFX;      // render.js --sfx 會把這份音效時間表存成 sfx.json，交給 make-bgm.py

/* ── 播放控制 ── */
const turb = document.getElementById("turb");
const all = () => document.getAnimations();
const boil = t => turb.setAttribute("seed", 1 + (Math.floor(t * 6) % 5));      // 一秒換六張，五種抖法輪流
function seek(t) { all().forEach(a => { try { a.currentTime = t * 1000; } catch (e) {} }); boil(t); }
function play() { all().forEach(a => a.play()); }
function pause() { all().forEach(a => a.pause()); }
function fit() {
  const rec = document.body.classList.contains("record");
  const s = Math.min(innerWidth / 1080, (innerHeight - (rec ? 0 : 52)) / 1920);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener("resize", fit); fit();
// 一條跟影片等長的空動畫，專門拿來讀「現在播到第幾秒」
const probe = stage.animate([{ outlineOffset: "0px" }, { outlineOffset: "1px" }], { duration: TOTAL * 1000, fill: "forwards" });
const aud = document.getElementById("aud");
function restart() { seek(0); play(); try { aud.currentTime = 0; aud.play().catch(() => {}); } catch (e) {} }
const fillEl = document.getElementById("fill"), clock = document.getElementById("clock");
document.getElementById("replay").onclick = restart;
document.getElementById("rec").onclick = () => { document.body.classList.toggle("record"); fit(); restart(); };
document.getElementById("track").onclick = e => { const r = e.currentTarget.getBoundingClientRect(), t = ((e.clientX - r.left) / r.width) * TOTAL; seek(t); try { aud.currentTime = t; } catch (err) {} };
const REC = new URLSearchParams(location.search).get("rec") === "1";
if (REC) document.body.classList.add("record");
(function tick() {
  const t = Math.min(TOTAL, (probe.currentTime || 0) / 1000);
  if (!REC) boil(t);
  fillEl.style.width = (t / TOTAL) * 100 + "%"; clock.textContent = t.toFixed(1) + " / " + TOTAL.toFixed(1) + "s";
  requestAnimationFrame(tick);
})();
pause();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => new Promise(r => setTimeout(r, 250))).then(() => { seek(0); if (!REC) restart(); });
</script>
